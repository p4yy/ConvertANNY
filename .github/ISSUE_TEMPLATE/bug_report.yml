name: Bug report
description: Report a problem with ConvertANNY.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: ConvertANNY version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem. Remove personal information from files and screenshots.
      placeholder: "1. Open ConvertANNY…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add relevant details. Do not include passwords, private files or unredacted logs.
    validations:
      required: false
